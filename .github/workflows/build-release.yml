name: Build and Release Ssarg Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets for Universal binary
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Unix permissions on Gradle wrapper
        if: matrix.platform != 'windows-latest'
        run: chmod +x packages/app-lib/java/gradlew

      - name: Install repository dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Ssarg Launcher bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/app
          args: ${{ matrix.args }}
          includeRelease: false

      - name: Rename release artifacts with OS prefix
        shell: bash
        run: |
          OS_LABEL="${{ matrix.platform == 'windows-latest' && 'windows' || (matrix.platform == 'macos-latest' && 'macos' || 'linux') }}"
          mkdir -p ./renamed_artifacts
          find target/release/bundle/ apps/app/target/release/bundle/ 2>/dev/null -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) | while read -r file; do
            filename=$(basename "$file")
            new_name=$(echo "$filename" | sed "s/Ssarg[. _]Launcher/Ssarg.Launcher-${OS_LABEL}/g")
            cp "$file" "./renamed_artifacts/$new_name"
            echo "Renamed $filename -> $new_name"
          done

      - name: Upload Renamed Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ./renamed_artifacts/*
          name: 'Ssarg Launcher ${{ github.ref_name }}'
          body: 'Official automated release of Ssarg Launcher with unified Modrinth & CurseForge search and 1-Click JDK Auto-Installer.'
          draft: false
          prerelease: false
